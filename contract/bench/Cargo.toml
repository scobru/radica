[package]
name = "feedbench"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
radica-contract = { path = ".." }
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"
serde_json = "1"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
