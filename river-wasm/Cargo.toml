[package]
name = "radica-river"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only" # links river-core (LGPL-3.0); the rest of Radica stays MIT

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The commit whose room_contract.wasm is River's current pointer record (version 11, code hash bc9b4066…):
# the state format here must match the contract the rooms live under.
river-core = { git = "https://github.com/freenet/river", rev = "1e44e895f4fcc7c6278c70ac80ee6c4350ecd79d", features = ["ecies-randomized", "ecies-client", "migration"] }
# rand 0.8 (behind ecies-randomized) draws on getrandom 0.2; in the browser its source is the page (see `rng` in lib.rs)
getrandom = { version = "0.2", features = ["custom"] }
freenet-scaffold = "0.2.2"
ciborium = "0.2.2"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"

[profile.release]
opt-level = "z"
lto = true
strip = true
