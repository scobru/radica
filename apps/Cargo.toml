# Native Radica apps, kept in their own workspace and lockfile so UI dependencies and
# Cargo.lock changes here cannot touch the contract or delegate WASM builds in the root.
[workspace]
resolver = "3"
members = ["radica-app", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scobru/radica"

[workspace.dependencies]
radica-app = { path = "radica-app" }
# River rooms: the same river-core code the web runs as river.wasm, linked natively.
radica-river = { path = "../river-wasm" }
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }

[profile.dev]
incremental = false

[profile.test]
incremental = false


