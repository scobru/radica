# The Radica desktop app, kept in its own workspace and lockfile so its dependencies and
# Cargo.lock changes here cannot touch the contract or delegate WASM builds in the root.
[workspace]
resolver = "3"
members = ["desktop"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scobru/radica"

[profile.dev]
incremental = false

[profile.test]
incremental = false


