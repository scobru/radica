[package]
name = "radica-desktop"
description = "Radica desktop app: finds or installs a local Freenet node, then opens Radica web from it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "radica"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"
directories = "6"
wry = "0.57.1"
tao = "0.37.2"

# The icon inside radica.exe (build.rs). Built on Windows only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
