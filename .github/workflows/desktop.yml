name: App builds

# The desktop app (apps/desktop) for Windows, Linux and macOS, and the Android app (apps/android). Every run keeps the
# builds as artifacts; a `v*` tag also attaches them to that tag's GitHub release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: radica-linux-x86_64, messenger_name: radica-messenger-linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: radica-windows-x86_64, messenger_name: radica-messenger-windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: radica-macos-arm64, messenger_name: radica-messenger-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: radica-macos-x86_64, messenger_name: radica-messenger-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag is Radica's version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node -e "const v='v'+require('./package.json').version; if(process.env.TAG_NAME!==v){console.error('Tag '+process.env.TAG_NAME+' does not match '+v); process.exit(1);}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev
      - run: cargo build --release --locked --manifest-path apps/Cargo.toml -p radica-desktop --bins --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.name }}.tar.gz -C apps/target/${{ matrix.target }}/release radica
          tar -czf ${{ matrix.messenger_name }}.tar.gz -C apps/target/${{ matrix.target }}/release radica-messenger
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path apps/target/${{ matrix.target }}/release/radica.exe -DestinationPath ${{ matrix.name }}.zip
          Compress-Archive -Path apps/target/${{ matrix.target }}/release/radica-messenger.exe -DestinationPath ${{ matrix.messenger_name }}.zip
      - name: Package (macOS app bundles)
        if: runner.os == 'macOS'
        run: |
          VER=$(node -p "require('./package.json').version")
          pack_mac() {
            app_dir="$1.app/Contents"
            mkdir -p "$app_dir/MacOS" "$app_dir/Resources"
            cp "apps/target/${{ matrix.target }}/release/$2" "$app_dir/MacOS/$2"
            sips -s format icns apps/desktop/assets/icon-512.png --out "$app_dir/Resources/Radica.icns"
            cat > "$app_dir/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>$1</string>
            <key>CFBundleIdentifier</key><string>$3</string>
            <key>CFBundleExecutable</key><string>$2</string>
            <key>CFBundleIconFile</key><string>Radica</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSMicrophoneUsageDescription</key><string>Radica uses your microphone to record end-to-end encrypted voice messages.</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
            ditto -c -k --keepParent "$1.app" "$4.zip"
          }
          pack_mac "Radica" "radica" "org.freenet.radica" "${{ matrix.name }}"
          pack_mac "Radica Messenger" "radica-messenger" "org.freenet.radica.messenger" "${{ matrix.messenger_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.messenger_name }}
          path: ${{ matrix.messenger_name }}.*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is Radica's version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node -e "const v='v'+require('./package.json').version; if(process.env.TAG_NAME!==v){console.error('Tag '+process.env.TAG_NAME+' does not match '+v); process.exit(1);}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # shortcut: a debug-signed APK (each CI runner signs with its own key, so an update needs an uninstall first);
      # sign releases with a keystore kept in repository secrets once the app is published
      - run: gradle -p apps/android assembleDebug
      - run: |
          cp apps/android/build/outputs/apk/full/debug/*.apk radica-android-debug.apk
          cp apps/android/build/outputs/apk/messenger/debug/*.apk radica-messenger-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: radica-android
          path: radica-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: radica-messenger-android
          path: radica-messenger-android-debug.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: radica-*
