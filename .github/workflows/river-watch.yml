name: River watch

# Once a day: has River re-keyed its room contract? If so, open an issue (once) with what Radica must update.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: cmp
        run: python3 .github/scripts/river-watch.py >> "$GITHUB_OUTPUT"
      - if: steps.cmp.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "River room contract moved to v${{ steps.cmp.outputs.version }}"
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == env.TITLE)) | length")
          if [ "$open" = "0" ]; then gh issue create --title "$TITLE" --body-file river-watch.md; fi
